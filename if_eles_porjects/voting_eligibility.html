<!DOCTYPE html>
<html lang="en">

<head>
    <title>Voting Eligibility</title>
</head>

<body>

    <div id="root"></div>

    <script>
        let age = prompt("Enter your age");

        if (age >= 18) {
            document.getElementById("root").innerHTML =
                "You are eligible for voting.";
        } else {
            document.getElementById("root").innerHTML =
                "You are not eligible for voting.";
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="root"></div>



    <script>
        let year = prompt("enter your year")

        if (year % 4 == 0) {
            document.getElementById("root").innerHTML = "this is a leep year"
        }

        else {
            document.getElementById("root").innerHTML = "this is not a leap year"
        }
    </script>
</body>

</html>

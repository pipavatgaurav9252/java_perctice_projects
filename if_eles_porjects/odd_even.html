<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>even-odd</title>
</head>

<body>
    <div id="root"></div>



    <script>
        let num = Number(prompt("Enter the number "))

        if (num % 2 == 0) {
            document.getElementById("root").innerHTML = " The number is even."
        }
        else {
            document.getElementById("root").innerHTML = " The number is odd."
        }


    </script>

</body>

</html>

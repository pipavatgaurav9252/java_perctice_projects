<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vowel</title>
</head>

<body>
    <div id="root"></div>

    <script>
        let ch = prompt("Enter a character")

        if (ch == 'a' || ch == 'e' || ch == 'i' || ch == 'o' || ch == 'u') {
            document.getElementById("root").innerHTML = "alphabet is vowel"
        }
        else {
            document.getElementById("root").innerHTML = "alphabet is consonant"
        }

    </script>
</body>
    
</html>

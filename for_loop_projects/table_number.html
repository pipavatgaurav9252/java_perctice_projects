<!DOCTYPE html>
<html>

<body>
    <div id="root"></div>

    <script>
        let num = Number(prompt("Enter a number"));
        let result = "";

        for (let i = 1; i <= 10; i++) {
            result += num + " x " + i + " = " + (num * i) + "<br>";
        }

        document.getElementById("root").innerHTML = result;
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<body>
    <div id="root"></div>

    <script>
        let num = Number(prompt("Enter a number"));
        let fact = 1;

        for (let i = 1; i <= num; i++) {
            fact = fact * i;
        }

        document.getElementById("root").innerHTML = "Factorial = " + fact;
    </script>
</body>

</html>

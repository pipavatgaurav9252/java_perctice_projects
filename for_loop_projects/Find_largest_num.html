<!DOCTYPE html>
<html>

<body>
    <div id="root"></div>

    <script>
        let arr = [10, 25, 5, 40, 15, 55, 30, 12, 345];
        let largest = arr[0];

        for (let i = 1; i < arr.length; i++) {
            if (arr[i] > largest) {
                largest = arr[i];
            }
        }

        document.getElementById("root").innerHTML = "Largest number = " + largest;
    </script>
</body>

</html>

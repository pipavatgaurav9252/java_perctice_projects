<!DOCTYPE html>
<html>

<body>
    <div id="root"></div>

    <script>
        let str = prompt("Enter a string");
        let rev = "";

        for (let i = str.length - 1; i >= 0; i--) {
            rev += str[i];
        }

        document.getElementById("root").innerHTML = "Reverse = " + rev;
    </script>
</body>

</html>

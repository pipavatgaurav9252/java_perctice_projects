<!DOCTYPE html>
<html lang="en">

<head>
    <title>Divisibility Check</title>
</head>

<body>

    <div id="root"></div>

    <script>
        let num = Number(prompt("Enter a number"));

        switch (num % 55) {
            case 0:
                document.getElementById("root").innerHTML =
                    "Number is divisible by 5 and 11";
                break;

            default:
                document.getElementById("root").innerHTML =
                    "Number is not divisible by 5 and 11";
        }
    </script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>
    <title>Simple Calculator</title>
</head>

<body>

    <div id="root"></div>

    <script>
        let a = Number(prompt("Enter first number"));
        let op = prompt("Enter operator (+, -, *, /)");
        let b = Number(prompt("Enter second number"));

        switch (op) {
            case "+":
                document.getElementById("root").innerHTML = a + b;
                break;

            case "-":
                document.getElementById("root").innerHTML = a - b;
                break;

            case "*":
                document.getElementById("root").innerHTML = a * b;
                break;

            case "/":
                switch (b) {
                    case 0:
                        document.getElementById("root").innerHTML = "Cannot divide by zero";
                        break;

                    default:
                        document.getElementById("root").innerHTML = a / b;
                }
                break;

            default:
                document.getElementById("root").innerHTML = "Invalid Operator";
        }
    </script>

</body>

</html>

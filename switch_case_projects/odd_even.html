
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even-Odd</title>
</head>

<body>

    <div id="root"></div>

    <script>
        let num = Number(prompt("Enter the number"));

        switch (num % 2) {
            case 0:
                document.getElementById("root").innerHTML = "The number is even.";
                break;

            case 1:
            
                document.getElementById("root").innerHTML = "The number is odd.";
                break;
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Vowel or Consonant</title>
</head>

<body>

    <div id="root"></div>

    <script>
        let ch = prompt("Enter a character");

        switch (ch) {
            case "a":
            case "e":
            case "i":
            case "o":
            case "u":

            case "A":
            case "E":
            case "I":
            case "O":
            case "U":
                document.getElementById("root").innerHTML = "Vowel";
                break;

            default:
                document.getElementById("root").innerHTML = "Consonant";
        }
    </script>

</body>

</html>
